name: Firmware checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Control, storage, transport and fault tests with ASan/UBSan
        run: bash scripts/test-firmware.sh
  nano-every:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:megaavr@1.8.8
      - name: Compile actual ATmega4809 target
        run: arduino-cli compile --warnings all --fqbn arduino:megaavr:nona4809:mode=off --output-dir build/firmware firmware/RockSawWaterControl
      - uses: actions/upload-artifact@v4
        with:
          name: nano-every-v1-bench-${{ github.sha }}
          path: |
            build/firmware/*.hex
            build/firmware/*.elf
          if-no-files-found: error
          retention-days: 90
